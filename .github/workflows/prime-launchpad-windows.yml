name: Build Prime Launchpad for Windows

on:
  push:
    paths:
      - "prime_launchpad.py"
      - ".github/workflows/prime-launchpad-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PrimeLaunchpad prime_launchpad.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeLaunchpad-Windows-EXE
          path: dist/PrimeLaunchpad.exe
          if-no-files-found: error
